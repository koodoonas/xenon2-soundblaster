# Both audio devices enabled, without IRQ/DMA conflicts.
[sdl]
fullscreen=false
[dosbox]
memsize=16
working directory option=noprompt
[cpu]
core=normal
cycles=fixed 20000
[sblaster]
sbtype=sb16
sbbase=220
irq=7
dma=1
[gus]
gus=true
gusbase=240
gusirq=5
gusdma=3
[speaker]
pcspeaker=false
[dos]
xms=true
ems=true
# At the DOS prompt, set matching values:
# SET BLASTER=A220 I7 D1 T6
# SET ULTRASND=240,3,3,5,5
# Run START.BAT. Select 1=SB or 2=GUS.
